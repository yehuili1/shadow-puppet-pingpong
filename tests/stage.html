<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>stage test</title>
<style>html,body{margin:0;height:100%;background:#0e0e0e;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// 戏台渲染测试：替身 director（抛物线球 + 拖尾 + 桌子淡出 + 剑击事件）+ 替身/真 rig + 替身手
// 参数：?rig=real 用真 rig.js/art.js（失败回退替身）  ?hand=0 无手  ?inset=40 戏台视口内缩（测 clip）
//       ?bare=1 只画背景（无皮影/球/桌）  ?sword=6 剑击间隔秒（0 关）  ?dpr=2 强制 dpr  ?stress=3 每帧重复画 N 次戏台（测余量：N 次仍 60fps 说明有 N 倍余量）  ?shade=0 关皮影投影
import { StageRenderer } from '../src/render/stage.js';
import { StubDirector } from './stubs/stage_director_stub.js';
import { StubRig } from './stubs/stage_rig_stub.js';
import { stubHand } from './stubs/stage_hand_stub.js';
import { clock } from '../src/core/events.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stage = new StageRenderer();
const director = new StubDirector({ swordEvery: Number(q.get('sword') ?? 6) });
const info = { rig: 'stub', rigError: null };

let Rig = StubRig;
if (q.get('rig') === 'real') {
  try {
    const art = await import('../src/puppet/art.js');
    await art.loadPuppetArt();
    Rig = (await import('../src/puppet/rig.js')).PuppetRig;
    info.rig = 'real';
  } catch (e) {
    info.rigError = String(e);
    console.warn('real rig unavailable, using stub:', e);
  }
}
if (q.get('shade') === '0') stage._drawPuppetShade = () => {};   // 测试：关皮影投影对比耗时
const playerRig = new Rig({ character: 'hero', facing: 1 });
const cpuRig = new Rig({ character: 'rival', facing: -1 });

let dpr = 1;
function resize() {
  dpr = Number(q.get('dpr')) || window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight, inset = Number(q.get('inset') || 0);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stage.resize({ x: inset, y: inset, w: w - inset * 2, h: h - inset * 2 }, dpr);
}
addEventListener('resize', resize);
resize();

const frameMs = [], stageMs = [], gaps = [];
let last = performance.now(), frames = 0;
const stress = Math.max(1, Number(q.get('stress') || 1));
function frame(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
  gaps.push(now - last);
  last = now;
  const t0 = performance.now();
  director.update(dt, { playerRig, cpuRig });
  const t = clock();
  const hand = q.get('hand') === '0' ? stubHand(t, { visible: false }) : stubHand(t);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const t1 = performance.now();
  for (let i = 0; i < stress; i++) {
    if (q.has('bare')) stage.draw(ctx, { t, dt, director: { tableAlpha: 0, ball: { visible: false } }, hand });
    else stage.draw(ctx, { t, dt, director, playerRig, cpuRig, hand });
  }
  const t2 = performance.now();
  frameMs.push(t2 - t0);
  stageMs.push(t2 - t1);
  for (const a of [frameMs, stageMs, gaps]) if (a.length > 240) a.shift();
  frames++;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 渲染后端（判断无头环境是否软件光栅）
let renderer = 'unknown';
try {
  const gl = document.createElement('canvas').getContext('webgl');
  const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
  renderer = gl ? gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER) : 'no webgl';
} catch (e) { renderer = String(e); }

const avg = (a) => (a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0);
const pct = (a, p) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.min(s.length - 1, Math.floor(s.length * p))] : 0; };
window.__stage = stage;
Object.defineProperty(window, '__test', {
  get: () => ({
    ...info,
    renderer,
    size: `${innerWidth}x${innerHeight}@${dpr}`,
    frames,
    avgFrameMs: +avg(frameMs).toFixed(2),
    p95FrameMs: +pct(frameMs, 0.95).toFixed(2),
    avgStageMs: +avg(stageMs).toFixed(2),
    avgIntervalMs: +avg(gaps.slice(1)).toFixed(2),
    bgBuildMs: +stage.lastBgMs.toFixed(1),
    particles: stage.particles.length,
    tableAlpha: +director.tableAlpha.toFixed(2),
    stress,
  }),
});
</script>
</body>
</html>
